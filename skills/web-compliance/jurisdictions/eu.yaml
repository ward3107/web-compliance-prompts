jurisdiction: eu
name: European Union / EEA
last_reviewed: 2026-09-03
reviewed_by: unverified
needs_legal_review: true

frameworks:

  - id: gdpr
    name: General Data Protection Regulation (EU) 2016/679
    short: GDPR
    effective: 2018-05-25
    governs: [privacy_policy, data_subject_rights, lawful_basis, transfers, breach]
    citation: https://eur-lex.europa.eu/eli/reg/2016/679/oj
    verified: true
    key_articles:
      lawful_basis: Article 6
      consent_conditions: Article 7
      transparency: Articles 13-14
      access: Article 15
      rectification: Article 16
      erasure: Article 17
      restriction: Article 18
      portability: Article 20
      object: Article 21
      breach_notification: Articles 33-34
    requires:
      - lawful_basis_per_purpose
      - freely_given_consent
      - withdraw_as_easy_as_give
      - data_subject_access
      - data_subject_portability
      - data_subject_erasure
      - transfer_safeguards        # SCCs / adequacy decision
      - response_within_one_month

  - id: eprivacy
    name: ePrivacy Directive 2002/58/EC (as amended by 2009/136/EC), Article 5(3)
    short: ePrivacy
    governs: [cookie_consent, device_storage]
    citation: https://eur-lex.europa.eu/eli/dir/2002/58/oj
    verified: true
    notes: >
      THIS — not the GDPR — is the legal source of the EU cookie banner.
      Article 5(3) requires prior informed consent before storing or accessing
      ANY information on a user's device, cookie or not (localStorage,
      fingerprinting, SDK identifiers all count). The GDPR then supplies what
      valid consent means (Art. 4(11), Art. 7). Strictly necessary storage is
      exempt. Implemented separately by each member state, so national rules
      differ in detail.
    requires:
      - prior_consent            # BEFORE any non-essential storage
      - granular_per_purpose
      - no_pre_ticked_boxes
      - reject_as_easy_as_accept
      - withdrawable_any_time
      - no_cookie_walls_by_default

  - id: eaa
    name: European Accessibility Act — Directive (EU) 2019/882
    short: EAA
    effective: 2025-06-28
    governs: [accessibility]
    citation: https://eur-lex.europa.eu/eli/dir/2019/882/oj
    verified: true
    notes: >
      Applies to e-commerce, banking, transport and other in-scope consumer
      services. Conformity is demonstrated via the harmonised standard
      EN 301 549, which incorporates WCAG 2.1 Level AA — a higher bar than
      Israel's IS 5568 (WCAG 2.0 AA). Micro-enterprises providing services
      have exemptions; verify scope for your client.
    requires:
      - en_301_549
      - wcag_21_aa
      - accessibility_statement

  - id: en301549
    name: EN 301 549 — Accessibility requirements for ICT products and services
    governs: [accessibility]
    maps_to: WCAG 2.1 Level AA
    citation: https://www.etsi.org/standards
    verified: true

  - id: websites_apps_directive
    name: Web Accessibility Directive (EU) 2016/2102
    governs: [accessibility]
    scope: public_sector_bodies
    citation: https://eur-lex.europa.eu/eli/dir/2016/2102/oj
    verified: true
    notes: Public sector sites/apps only. Also requires an accessibility statement.

consent_model: opt_in            # prior consent; opt-out is NOT sufficient
rtl: false
languages: [en, de, fr, es, it, nl, pl, pt]   # extend per target market
currency: EUR

# Where EU rules differ from other packs — surface these to the user.
conflicts:
  - with: us-ca
    issue: >
      The EU requires opt-in consent BEFORE non-essential storage; California
      uses an opt-out model ("Do Not Sell or Share"). A site serving both must
      implement opt-in for EU visitors and an opt-out control for California —
      geo-detection decides which UI to present. Applying opt-out globally
      breaches ePrivacy; applying opt-in globally is safe but costs conversions.
  - with: il
    issue: >
      Israel's IS 5568 targets WCAG 2.0 AA while the EAA requires WCAG 2.1 AA.
      Build to 2.1 AA — it is a superset and satisfies both.
